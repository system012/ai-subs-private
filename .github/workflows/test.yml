name: test
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Compiled binary starts
        run: |
          bun build index.ts --compile --target=bun-linux-x64 --outfile ai-subs-linux-x64
          ./ai-subs-linux-x64 --help
